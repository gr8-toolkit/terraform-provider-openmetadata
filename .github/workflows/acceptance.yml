# Acceptance test workflow — spins up a real OpenMetadata instance via
# docker compose (official release image) and runs TF_ACC=1 tests against it.
#
# To add a new version: add it to the matrix below and update docker/test/.env
# default if desired.
#
# Runs on pushes to main and PRs that touch the provider or its test harness —
# doc and config changes do not need a live OpenMetadata stack. Because a
# path-filtered workflow never reports its check, this one must NOT be a
# required status check, or unrelated PRs would block forever.
name: Acceptance Tests

on:
  push:
    branches:
      - main
    paths:
      - 'internal/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'docker/test/**'
      - 'scripts/testacc.sh'
      - 'scripts/testacc-all.sh'
      - '.github/workflows/acceptance.yml'
  pull_request:
    paths:
      - 'internal/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'docker/test/**'
      - 'scripts/testacc.sh'
      - 'scripts/testacc-all.sh'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: "OM ${{ matrix.om_version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        om_version:
          - "1.12.4"
          - "2.0.3"

    env:
      OM_HOST: "http://localhost:8585"
      OM_HEALTH_URL: "http://localhost:8586/healthcheck"
      OM_ADMIN_EMAIL: "admin@open-metadata.org"
      # Override via repo secret OM_ADMIN_PASSWORD if the default changes.
      OM_ADMIN_PASSWORD: ${{ secrets.OM_ADMIN_PASSWORD || 'admin' }}
      # Passed to docker compose — overrides OPENMETADATA_VERSION in .env.
      OPENMETADATA_VERSION: ${{ matrix.om_version }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Go toolchain ──────────────────────────────────────────────────────────
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ── Terraform CLI (required by terraform-plugin-testing) ──────────────────
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # ── Tune kernel for Elasticsearch ─────────────────────────────────────────
      # Elasticsearch 9.x requires vm.max_map_count ≥ 262144.
      - name: Set vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      # ── Start OpenMetadata test stack ─────────────────────────────────────────
      # OPENMETADATA_VERSION is set at the job level — docker compose picks it up
      # from the shell environment, which takes precedence over the .env file.
      # We skip the heavy `ingestion` (Airflow) service; PIPELINE_SERVICE_CLIENT_ENABLED=false
      # in docker/test/.env means the OM server will not try to reach it.
      - name: Pull images
        run: |
          docker compose \
            -f docker/test/docker-compose.yml \
            --env-file docker/test/.env \
            pull --quiet \
            mysql elasticsearch execute-migrate-all openmetadata-server

      - name: Start OpenMetadata test stack
        run: |
          docker compose \
            -f docker/test/docker-compose.yml \
            --env-file docker/test/.env \
            up -d \
            mysql elasticsearch execute-migrate-all openmetadata-server

      # ── Wait for OpenMetadata ──────────────────────────────────────────────────
      - name: Wait for OpenMetadata to be healthy
        run: |
          echo "Polling ${OM_HEALTH_URL} for OpenMetadata ${OPENMETADATA_VERSION} (up to 10 minutes)..."
          for i in $(seq 1 60); do
            if curl -sf "${OM_HEALTH_URL}" > /dev/null 2>&1; then
              echo "OpenMetadata is ready after $((i * 10))s"
              exit 0
            fi
            echo "  attempt ${i}/60 — waiting 10s..."
            sleep 10
          done
          echo "OpenMetadata failed to become healthy. Last 100 lines of server log:"
          docker compose \
            -f docker/test/docker-compose.yml \
            --env-file docker/test/.env \
            logs openmetadata-server --tail=100
          exit 1

      # ── Acquire JWT token ──────────────────────────────────────────────────────
      - name: Acquire JWT token
        id: auth
        run: |
          OM_ADMIN_PASSWORD_B64="$(echo -n "${OM_ADMIN_PASSWORD}" | base64)"
          PAYLOAD_FILE="$(mktemp)"
          printf '{"email":"%s","password":"%s"}' "${OM_ADMIN_EMAIL}" "${OM_ADMIN_PASSWORD_B64}" > "${PAYLOAD_FILE}"

          RESPONSE="$(curl -sf -X POST \
            "${OM_HOST}/api/v1/users/login" \
            -H "Content-Type: application/json" \
            --data-binary "@${PAYLOAD_FILE}")" || {
              rm -f "${PAYLOAD_FILE}"
              echo "Login request failed."
              exit 1
            }
          rm -f "${PAYLOAD_FILE}"

          TOKEN="$(echo "${RESPONSE}" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              tok = d.get('accessToken') or d.get('token') or ''
              if not tok:
                  sys.stderr.write('No token in response: ' + repr(d)[:300] + '\n')
              print(tok, end='')
          except Exception as e:
              sys.stderr.write('Parse error: ' + str(e) + '\n')
          ")"

          if [ -z "${TOKEN}" ]; then
            echo "Failed to extract JWT token. Response: ${RESPONSE:0:500}"
            exit 1
          fi

          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "JWT token acquired (length: ${#TOKEN})"

      # ── Run acceptance tests ───────────────────────────────────────────────────
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          OPENMETADATA_HOST: ${{ env.OM_HOST }}
          OPENMETADATA_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          go test \
            -v \
            -count=1 \
            -timeout 25m \
            ./internal/provider/...

      # ── Tear down (always runs) ────────────────────────────────────────────────
      - name: Tear down test stack
        if: always()
        run: |
          docker compose \
            -f docker/test/docker-compose.yml \
            --env-file docker/test/.env \
            down -v --remove-orphans
